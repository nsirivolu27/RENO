name: CI

on:
  push:
    branches: ["main", "rebuild"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The whole app must work with zero provider keys and zero paid services.
      # CI deliberately sets no GEMINI/OPENAI/REPLICATE keys.
      - name: Start server
        run: |
          RENO_DATA_DIR="${RUNNER_TEMP}/reno-data" \
          RENO_MAX_PROJECTS_PER_VISITOR=5 \
          RENO_MAX_RENDERS_PER_PROJECT=3 \
          npm run start --workspace @reno/web > /tmp/reno-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/reno-server.log; exit 1

      - name: Smoke — no-key demo render
        run: npm run smoke:demo

      - name: Smoke — projects, renders, shares
        run: npm run smoke:backend

      - name: Smoke — error paths and limits
        run: npm run smoke:negatives

      - name: Smoke — catalog pricing and company portal
        run: npm run smoke:marketplace

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/reno-server.log || true

  guardrails:
    name: Product guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # These are product rules, not style preferences. See CLAUDE.md.
      - name: No legacy branding or storage keys
        run: |
          if grep -rniE "openreno|@openreno" --include="*.ts" --include="*.tsx" --include="*.json" \
               apps packages 2>/dev/null; then
            echo "::error::Found legacy OpenReno branding. The product is Reno; the scope is @reno."
            exit 1
          fi
          if grep -rnE '"(or_key|or_provider|or_visitor)"|openreno_' --include="*.ts" --include="*.tsx" \
               apps packages 2>/dev/null; then
            echo "::error::Found legacy storage keys. Use reno_key / reno_provider / reno_visitor / reno_projects."
            exit 1
          fi

      - name: No Tailwind or UI frameworks in apps/web
        run: |
          if grep -rniE '"(tailwindcss|@mui/|antd|chakra-ui|bootstrap)"' apps/web/package.json 2>/dev/null; then
            echo "::error::apps/web must stay plain CSS with no UI framework."
            exit 1
          fi

      - name: Demo provider stays registered (zero-key path)
        run: |
          if ! grep -q "demo" packages/core/src/providers/index.ts; then
            echo "::error::The demo provider must stay registered so Reno runs with no API keys."
            exit 1
          fi
